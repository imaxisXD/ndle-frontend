name: Frontend checks
on:
  pull_request:
  push:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://local-validation.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bG9jYWwtdmFsaWRhdGlvbi5jbGVyay5hY2NvdW50cy5kZXYk
